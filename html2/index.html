<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมแปลงสกุลเงิน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>โปรแกรมแปลงสกุลเงิน</h1>

        <section>
            <h2>จำนวนเงินต้นทาง</h2>
            <input type="number" id="amount-one">
            <select id="currency-one">
                <option value="THB">THB</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="JPY">JPY</option>
            </select>
        </section>

        <button id="swap-btn" type="button">สลับสกุลเงิน</button>

        <section>
            <h2>จำนวนเงินปลายทาง</h2>
            <input type="number" id="amount-two" readonly>
            <select id="currency-two">
                <option value="USD">USD</option>
                <option value="THB">THB</option>
                <option value="EUR">EUR</option>
                <option value="JPY">JPY</option>
            </select>
        </section>

        <p id="rate">อัตราแลกเปลี่ยน</p>

        <button id="clear-btn" type="button">ล้างข้อมูล</button>
        <button id="clear-history-btn" type="button">ล้างประวัติ</button>

        <section>
            <h2>ประวัติการแปลงเงินย้อนหลัง 10 รายการล่าสุด</h2>
            <ul id="history-list"></ul>
        </section>

        <p id="last-update">เวลาที่อัปเดตล่าสุด</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
