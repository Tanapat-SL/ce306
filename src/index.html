  @custom-variant dark (&:where(.dark, .darlk *));

  @theme{

}
 @layer base {
    html { color-scheme: light ; }
    html.dark {color_scheme: dark ;}
    body { font-family: var(--font-display);}
    ::selection { background: color_mix(in oklab, var(--color-brand-400)40% transparent);}
